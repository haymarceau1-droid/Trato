<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8faf8;
        color: #14201a;
        text-align: center;
        padding: 1rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0d1511;
          color: #eef5f0;
        }
      }
      button {
        min-height: 44px;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 12px;
        background: #15803d;
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>Parece que no tienes internet. Revisa tu conexión e inténtalo de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
